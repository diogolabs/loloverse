# Opção Recomendada: Cloudflare Tunnel (`cloudflared`)
# - ZERO portas HTTP/HTTPS abertas no firewall da VM ou Security List da Oracle
# - Bloqueia `/_/` E todas as APIs de Superuser na internet pública (`404`)
# - O retorno do Google OAuth2 acontece no próprio frontend Next.js (`/auth/callback`)

tunnel: SEU-TUNNEL-UUID-AQUI
credentials-file: /etc/cloudflared/SEU-TUNNEL-UUID-AQUI.json

ingress:
  # Bloqueia painel /_/ na internet pública (use túnel SSH local)
  - hostname: api-loloverse.diogolabs.dev.br
    path: ^/_(/.*)?$
    service: http_status:404

  # Bloqueia APIs administrativas/Superuser na internet pública
  - hostname: api-loloverse.diogolabs.dev.br
    path: ^/api/(collections/_superusers|settings|backups|logs|crons)(/.*)?$
    service: http_status:404

  # Libera API e Realtime SSE do PocketBase
  - hostname: api-loloverse.diogolabs.dev.br
    service: http://172.18.0.1:8090
    originRequest:
      noTLSVerify: false
      connectTimeout: 10s
      disableChunkedEncoding: false

  - service: http_status:404
